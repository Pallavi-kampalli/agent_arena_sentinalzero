services:
  postgres:
    image: postgres:16-alpine
    container_name: agent_arena_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_arena
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_arena"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
