services:
  postgres:
    image: postgres:16-alpine
    container_name: agent_arena_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_arena
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_arena"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - agent_arena_net

  migration:
    build: .
    container_name: agent_arena_migration
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/agent_arena
      ENVIRONMENT: ${ENVIRONMENT:-staging}
    command: ["alembic", "upgrade", "head"]
    networks:
      - agent_arena_net

  api:
    build: .
    container_name: agent_arena_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    ports:
      - "${PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/agent_arena
      ADMIN_PANEL_SECRET: ${ADMIN_PANEL_SECRET}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      PORT: 8000
      REVEAL_GROUND_TRUTH: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    command:
      [
        "uvicorn",
        "agent_arena.api.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "1",
      ]
    networks:
      - agent_arena_net

networks:
  agent_arena_net:
    driver: bridge

volumes:
  postgres_data:

